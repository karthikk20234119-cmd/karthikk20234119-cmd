<svg width="1400" height="480" viewBox="0 0 1400 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#181A20"/>
      <stop offset="55%" stop-color="#111116"/>
      <stop offset="100%" stop-color="#08090D"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFD700" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8A56A"/>
    </linearGradient>
    <filter id="softBlur"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="1400" height="480" fill="url(#bgGlow)"/>

  <!-- circuit grid -->
  <g stroke="#22D3EE" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="80" x2="1400" y2="80"/>
    <line x1="0" y1="160" x2="1400" y2="160"/>
    <line x1="0" y1="400" x2="1400" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="480"/>
    <line x1="1200" y1="0" x2="1200" y2="480"/>
  </g>

  <!-- AI core -->
  <circle cx="1100" cy="230" r="230" fill="url(#coreGlow)"/>
  <g fill="none" stroke="#D4AF37" stroke-opacity="0.55" stroke-width="1.5">
    <circle cx="1100" cy="230" r="120"/>
    <circle cx="1100" cy="230" r="150" stroke="#22D3EE" stroke-opacity="0.35"/>
    <circle cx="1100" cy="230" r="185" stroke="#8B5CF6" stroke-opacity="0.3" stroke-dasharray="4 10"/>
  </g>
  <circle cx="1100" cy="230" r="10" fill="#FFD700"/>
  <g stroke="#22D3EE" stroke-width="1.5" opacity="0.8">
    <line x1="1100" y1="230" x2="1010" y2="150"/>
    <line x1="1100" y1="230" x2="1210" y2="140"/>
    <line x1="1100" y1="230" x2="1220" y2="300"/>
    <line x1="1100" y1="230" x2="1020" y2="320"/>
    <line x1="1100" y1="230" x2="1100" y2="90"/>
  </g>
  <g fill="#FFD700">
    <circle cx="1010" cy="150" r="4"/>
    <circle cx="1210" cy="140" r="4"/>
    <circle cx="1220" cy="300" r="4"/>
    <circle cx="1020" cy="320" r="4"/>
    <circle cx="1100" cy="90" r="4"/>
  </g>

  <!-- floating particles -->
  <g fill="#22D3EE" opacity="0.6">
    <circle cx="850" cy="90" r="2.5"/>
    <circle cx="920" cy="380" r="2"/>
    <circle cx="1330" cy="90" r="2.5"/>
    <circle cx="1350" cy="360" r="2"/>
  </g>
  <g fill="#D4AF37" opacity="0.6">
    <circle cx="780" cy="220" r="2"/>
    <circle cx="1300" cy="220" r="2"/>
  </g>

  <!-- metallic accent ring bottom-left steel motif -->
  <g transform="translate(90,380)" opacity="0.5">
    <path d="M0,0 L20,-34 L40,0 Z" fill="none" stroke="#B8A56A" stroke-width="2"/>
  </g>

  <!-- title block -->
  <text x="90" y="200" font-family="Arial, sans-serif" font-size="66" font-weight="800" fill="url(#titleGrad)" letter-spacing="4">KARTHIK K</text>
  <rect x="92" y="220" width="420" height="3" fill="url(#goldLine)"/>
  <text x="90" y="262" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#F5F2E8" letter-spacing="3">AI ENGINEER &#183; SOFTWARE ENGINEER</text>
  <text x="90" y="292" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#22D3EE" letter-spacing="3">AI SYSTEM BUILDER</text>

  <text x="90" y="336" font-family="Arial, sans-serif" font-size="16" fill="#B8A56A">Computer Vision &#183; Agentic AI &#183; Full-Stack Engineering</text>
</svg>
